  bench-context-mode:
    # Context Mode ctx_execute with Node only, then with Bun (session 11, items 8 and 9). Numbers go to the job summary.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - name: Throwaway HOME and npm prefix
        run: |
          home="$(mktemp -d)"
          echo "HOME=$home" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            # Node, npm and PowerShell need Windows paths; npm puts global bins in the prefix itself.
            win="$(cygpath -w "$home")"
            { echo "USERPROFILE=$win"; echo "BUN_INSTALL=$win\.bun"; echo "npm_config_prefix=$win\npm"; } >> "$GITHUB_ENV"
            { echo "$win\npm"; echo "$win\.bun\bin"; } >> "$GITHUB_PATH"
          else
            { echo "BUN_INSTALL=$home/.bun"; echo "npm_config_prefix=$home/npm"; } >> "$GITHUB_ENV"
            { echo "$home/npm/bin"; echo "$home/.bun/bin"; } >> "$GITHUB_PATH"
          fi
      - name: Install Context Mode (timed)
        run: |
          if command -v bun; then echo "Bun is already on PATH; the Node-only pass would not be Node only" >&2; exit 1; fi
          start=$SECONDS
          npm install -g "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('context-mode')))")" --foreground-scripts > "$HOME/npm-install.txt" 2>&1 || { tail -50 "$HOME/npm-install.txt"; exit 1; }
          took=$((SECONDS - start))
          # node-gyp prints "gyp info" only when better-sqlite3 compiles from source.
          if grep -q 'gyp info' "$HOME/npm-install.txt"; then sqlite=compiled; else sqlite=prebuilt; fi
          {
            echo "### Install on $RUNNER_OS"
            echo ""
            echo "- Node $(node --version), context-mode $(npm ls -g context-mode --depth=0 | grep -o 'context-mode@[^ ]*')"
            echo "- \`npm i -g context-mode\`: ${took}s, better-sqlite3 $sqlite"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Node only
        run: node tests/bench-context-mode.mjs node "$HOME/node.json"
      - name: Install Bun (timed)
        run: |
          start=$SECONDS
          if [ "$RUNNER_OS" = Windows ]; then
            bash scripts/ci-download.sh bun-windows-x64 "$RUNNER_TEMP/bun.zip"
            BUN_ZIP="$(cygpath -w "$RUNNER_TEMP/bun.zip")" powershell -NoProfile -Command 'Expand-Archive -Force -LiteralPath $env:BUN_ZIP -DestinationPath "$env:RUNNER_TEMP\bunx"; New-Item -ItemType Directory -Force "$env:BUN_INSTALL\bin" | Out-Null; Move-Item -Force "$env:RUNNER_TEMP\bunx\bun-windows-x64\bun.exe" "$env:BUN_INSTALL\bin\bun.exe"'
          else
            bash scripts/ci-download.sh bun-linux-x64 "$RUNNER_TEMP/bun.zip"
            mkdir -p "$BUN_INSTALL/bin"
            unzip -q -j -o "$RUNNER_TEMP/bun.zip" bun-linux-x64/bun -d "$BUN_INSTALL/bin"
          fi
          echo "- Bun install at user scope, no TTY: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: With Bun
        run: |
          command -v bun
          echo "- Bun $(bun --version)" >> "$GITHUB_STEP_SUMMARY"
          node tests/bench-context-mode.mjs bun "$HOME/bun.json" "$HOME/node.json"

