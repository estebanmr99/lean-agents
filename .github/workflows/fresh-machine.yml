name: Fresh machine

# `install.sh` / `install.ps1 --everything` on a runner with brew, Node.js, git, gh and nvm hidden, into a throwaway HOME,
# ending with `--doctor`. Nightly and on demand only: it never runs on a pull request, so it costs PRs no time.
# A failure opens or updates one `version-watch` issue. Hiding tools by PATH is not a truly bare image (see docs/compatibility.md).
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force-fail:
        description: Fail on purpose to test the issue report
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dist:
    # The packed release files, built once; the legs below use them through LEAN_AGENTS_DIST and need no Node.js to get them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node scripts/release.mjs "$(node -p "require('./package.json').version")" </dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  macos:
    needs: dist
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install everything with a system-only PATH
        run: |
          set -euo pipefail
          # The runner VM is thrown away after the job; moving the Homebrew prefix aside makes install.sh and the engine see no brew.
          for p in /opt/homebrew /usr/local/Homebrew; do
            if [ -d "$p" ]; then sudo mv "$p" "$p.hidden"; fi
          done
          home="$(mktemp -d)"
          lean() { env -i HOME="$home" TERM=dumb PATH=/usr/bin:/bin:/usr/sbin:/sbin LEAN_AGENTS_DIST="$PWD/dist" bash "$PWD/dist/install.sh" "$@"; }
          for c in brew node npm git gh nvm; do
            if env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin sh -c "command -v $c" | grep -v '^/usr/bin/git$'; then echo "$c is still visible"; exit 1; fi
          done
          lean --yes --everything
          grep -n lean-agents "$home"/.profile "$home"/.bashrc "$home"/.zshrc 2>/dev/null || true
          env -i HOME="$home" TERM=dumb PATH=/usr/bin:/bin:/usr/sbin:/sbin LEAN_AGENTS_DIST="$PWD/dist" bash -c 'for f in .profile .bashrc .zshrc; do [ -f "$HOME/$f" ] && . "$HOME/$f"; done; exec bash "$LEAN_AGENTS_DIST/install.sh" --doctor'

  windows:
    needs: dist
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The runner image has no winget, which a real Windows PC has: install it like real-winget does, so the winget routes run.
      - name: Install winget
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -Latest -Force
          winget --version
      - name: Install everything with Node.js, git, gh and nvm off PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # A fresh PC has no Git: remove the image's copy (the VM is thrown away), so winget's Git.Git install is a real first install.
          $unins = Get-ChildItem "$env:ProgramFiles\Git\unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unins) { Write-Output "Removing the image's Git ($($unins.Name))"; Start-Process $unins.FullName -ArgumentList '/VERYSILENT', '/NORESTART' -Wait } else { Write-Output 'No preinstalled Git found' }
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)nodejs|\\Git\\|GitHub CLI|nvm|npm' }) -join ';'
          foreach ($c in 'node', 'npm', 'git', 'gh', 'nvm') {
            if (Get-Command $c -ErrorAction SilentlyContinue) { throw "$c is still visible" }
          }
          # The image points npm's global prefix at C:\npm\prefix (npm_config_prefix); a real PC has npm's default.
          Remove-Item Env:npm_config_prefix, Env:NPM_CONFIG_PREFIX -ErrorAction SilentlyContinue
          $home2 = Join-Path $env:RUNNER_TEMP 'fresh-home'
          New-Item -ItemType Directory -Path $home2 | Out-Null
          $env:USERPROFILE = $home2
          $env:LEAN_AGENTS_DIST = (Resolve-Path dist).Path
          & (Join-Path $env:LEAN_AGENTS_DIST 'install.ps1') -Yes --everything
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Like the new terminal the install asks for: add the saved user PATH (not Machine, which would bring the hidden tools back).
          $env:Path = "$env:Path;$([Environment]::GetEnvironmentVariable('Path', 'User'))"
          & (Join-Path $env:LEAN_AGENTS_DIST 'install.ps1') -Doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      # Names and log tails only (no env values): why winget's Git failed and where its command links went.
      - name: Show winget diagnostics
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'  # a where.exe miss must not end the diagnostics
          $links = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          "Links ($links):"; Get-ChildItem $links -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name) $($_.LinkType) -> $($_.Target)" }
          "User Path entries:"; ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | ForEach-Object { "  $_" }
          $diag = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
          Get-ChildItem $diag -Filter 'Git.Git*.log' -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-ChildItem $env:TEMP -Filter 'Setup Log*.txt' -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          "where rtk:"; where.exe rtk 2>&1
          $env:Path = "$env:Path;$([Environment]::GetEnvironmentVariable('Path', 'User'))"
          "npm prefix -g:"; npm prefix -g 2>&1
          "where context-mode / opencode:"; where.exe context-mode opencode 2>&1

  linux:
    needs: dist
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install everything on a bare Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          # The image has no curl: install.sh needs it, and nothing else (no Node.js, git or gh).
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          for c in node npm git gh nvm; do
            if command -v "$c"; then echo "$c is still visible"; exit 1; fi
          done
          home="$(mktemp -d)"
          lean() { env -i HOME="$home" TERM=dumb PATH=/usr/bin:/bin:/usr/sbin:/sbin LEAN_AGENTS_DIST="$PWD/dist" bash "$PWD/dist/install.sh" "$@"; }
          lean --yes --everything
          grep -n lean-agents "$home"/.profile "$home"/.bashrc "$home"/.zshrc 2>/dev/null || true
          env -i HOME="$home" TERM=dumb PATH=/usr/bin:/bin:/usr/sbin:/sbin LEAN_AGENTS_DIST="$PWD/dist" bash -c 'for f in .profile .bashrc .zshrc; do [ -f "$HOME/$f" ] && . "$HOME/$f"; done; exec bash "$LEAN_AGENTS_DIST/install.sh" --doctor'

  forced:
    if: inputs.force-fail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'forced failure' && exit 1

  report:
    needs: [dist, macos, windows, linux, forced]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Fresh-machine install breaks'
          failed="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs -q '.jobs[] | select(.conclusion == "failure") | "- " + .name')"
          body="$(printf 'The nightly fresh-machine run failed: %s\n\nFailed jobs:\n%s\n\nIt runs `install.sh` and `install.ps1 --everything` with brew, Node.js, git, gh and nvm hidden, then `--doctor`. PRs are not affected.\n<!-- fresh-machine:%s -->' "$RUN_URL" "$failed" "$RUN_ID")"
          gh label create version-watch --color ededed --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label version-watch --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label version-watch --body "$body"
          fi
