name: assets

# Renders the demo GIF and the social preview, so no image tool runs on a working machine.
# Download the artifact, look at the frames, then commit demo.gif and social-preview.png.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/assets/banner.svg
      - docs/assets/demo.tape
      - .github/workflows/assets.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/demo.tape
      - name: Render the social preview
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1280 -h 640 docs/assets/banner.svg -o docs/assets/social-preview.png
      - name: Check both images and cut review frames
        run: |
          size="$(stat -c %s docs/assets/demo.gif)"
          test "$size" -gt 10000
          test "$size" -lt 5000000
          test "$(stat -c %s docs/assets/social-preview.png)" -lt 1000000
          file docs/assets/social-preview.png > social.txt
          cat social.txt
          grep -q '1280 x 640' social.txt
          mkdir frames
          ffmpeg -loglevel error -i docs/assets/demo.gif -vf fps=1/3 frames/frame-%02d.png
          test -f frames/frame-02.png
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            docs/assets/demo.gif
            docs/assets/social-preview.png
            frames/
          if-no-files-found: error
