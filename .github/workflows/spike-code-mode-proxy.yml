name: Spike Code Mode Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  spike:
    name: Spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          HOME: ${{ runner.temp }}/h
        run: |
          mkdir -p "${{ runner.temp }}/h"
          cd spikes/code-mode-proxy
          npm ci --ignore-scripts

      - name: Rebuild isolated-vm
        env:
          HOME: ${{ runner.temp }}/h
        run: |
          cd spikes/code-mode-proxy
          npm rebuild isolated-vm

      - name: Audit and List
        env:
          HOME: ${{ runner.temp }}/h
        run: |
          cd spikes/code-mode-proxy
          npm audit signatures > npm-audit-signatures.txt || true
          npm audit --json > npm-audit.json || true
          npm ls --all > npm-ls.txt || true

      - name: Run Measurements
        env:
          HOME: ${{ runner.temp }}/h
        run: |
          cd spikes/code-mode-proxy
          node measure.mjs
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-results-${{ matrix.os }}
          retention-days: 7
          path: |
            spikes/code-mode-proxy/npm-audit-signatures.txt
            spikes/code-mode-proxy/npm-audit.json
            spikes/code-mode-proxy/npm-ls.txt
            spikes/code-mode-proxy/result.json
            spikes/code-mode-proxy/SUMMARY.md
