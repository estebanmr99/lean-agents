name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # release notes diff core/pins.json against the previous tag
      # Release gate: only a commit that is on main and passed ci.yml can be released.
      - name: Tag on main with green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --json conclusion --jq 'map(select(.conclusion == "success")) | length')
          [ "${ok:-0}" -gt 0 ] || { echo "::error::no successful ci.yml run for $GITHUB_SHA"; exit 1; }
      # Release gate: no publish without this version's audit and with any medium+ finding still open.
      # An open audit issue labelled release-proof does not block: its proof is the release run itself.
      - name: Audit gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          audit="docs/audit-${GITHUB_REF_NAME#v}.md"
          test -f "$audit" || { echo "::error::$audit is missing"; exit 1; }
          grep -q '^## Summary' "$audit" && grep -q '^## Findings and issues' "$audit" || { echo "::error::$audit lacks the Summary and Findings and issues sections"; exit 1; }
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --label audit --state open --json number,labels \
            --jq '.[] | "\(if ([.labels[].name] | index("release-proof")) then "exempt" else "open" end) \(.number)"')
          blocked=""
          while read -r kind number; do
            [ -n "$number" ] || continue
            if [ "$kind" = exempt ]; then
              echo "::notice::exempt (release-proof): #$number, the release run is its proof"
            else
              blocked="$blocked #$number"
            fi
          done <<<"$issues"
          [ -z "$blocked" ] || { echo "::error::open audit issues:$blocked"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/check-readme.mjs
      - run: bash scripts/check-private.sh
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
      # The npm tarball bundles node_modules from package-lock.json.
      - run: npm ci --omit=dev
      - run: node scripts/release.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only this job can write; it runs no repo code, just publishes what build made.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/install.sh dist/install.ps1 --notes-file dist/notes.md --verify-tag --repo "$GITHUB_REPOSITORY"

  # Owner step: needs the repo variable NPM_PUBLISH=true and the `npm` environment (required reviewer).
  # Trusted publishing only (OIDC, no token): needs a trusted publisher on npmjs.com (repo, release.yml,
  # environment npm). See docs/compatibility.md.
  npm:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        run: npm publish "./dist/lean-agents-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
