name: Savings Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use (e.g. google-vertex/gemini-3.1-pro-preview)'
        required: true
        type: string

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          
      - name: Install OpenCode
        run: npm install -g @opencode/cli
        
      - name: Run Benchmark
        env:
          # The provider key secret must be configured in the repository settings.
          # For example, if using Google Vertex, set GOOGLE_APPLICATION_CREDENTIALS or similar.
          # If using Anthropic, set ANTHROPIC_API_KEY.
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          node tests/bench-savings.mjs \
            --home "${RUNNER_TEMP}/bench-home" \
            --run \
            --model "${{ inputs.model }}" \
            --out "${RUNNER_TEMP}/bench-out"
            
      - name: Upload Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-savings-results
          path: ${{ runner.temp }}/bench-out/
