# Fields the feedback flow (scripts/lib/feedback.mjs draftIssue, called from lean.mjs) fills today: os (platform + arch),
# version and agents (its `versions` map: lean-agents, node, plus any tool versions), command, error.
# Not filled yet, an agent adds it if it knows it: preset (the `--network` choice).
name: Bug report
description: Something in the installer or configs does not work
title: "bug: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: Remove usernames, paths, keys, proxy URLs and company details from everything you paste. Never paste tokens.
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: darwin arm64 / win32 x64 / linux x64
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents and versions
      placeholder: claude 2.x, opencode 2.x
  - type: input
    id: version
    attributes:
      label: lean-agents version
      description: The release tag or the commit you installed from.
      placeholder: 0.6.0
  - type: dropdown
    id: preset
    attributes:
      label: Network preset
      options: [on, off, custom flags, not sure]
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: node scripts/lean.mjs --yes --agents claude
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error
      description: The error text, plus the output of `--doctor` if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
