name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action scans pushes with --no-merges --first-parent, so a merge
      # into main scans 0 commits (#91). Pull requests keep it.
      - name: Gitleaks (pull request)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Push: the commits the push brings in. Weekly schedule: full history.
      - name: Gitleaks (push and schedule)
        if: github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          v=8.30.1
          tar=gitleaks_${v}_linux_x64.tar.gz
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/$tar" "https://github.com/gitleaks/gitleaks/releases/download/v$v/$tar"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/$tar" | sha256sum -c -
          tar -xzf "$dir/$tar" -C "$dir" gitleaks
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}"; then
            "$dir/gitleaks" git --redact --log-opts="$BEFORE..$GITHUB_SHA" .
          else
            "$dir/gitleaks" git --redact .
          fi
      - name: Private data check
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: bash scripts/check-private.sh
