name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A PR opened with GITHUB_TOKEN triggers no pull_request run; the pin-bump job dispatches this on the PR branch instead.
  workflow_dispatch:
  workflow_call:
    inputs:
      latest:
        description: Run the real-* jobs with the newest upstream versions instead of core/pins.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.latest && 'latest-' || '' }}${{ github.ref }}
  cancel-in-progress: true

env:
  # Context Mode 2 needs Node >=24.15 (on older Node npm installs 1.x, and the engine skips it), so every real-* job uses this.
  NODE_FOR_CONTEXT_MODE: 24
  # The lean-update skill is pinned to a release tag that does not exist before release; real-* jobs install it from the checkout.
  LEAN_AGENTS_SKILL_SOURCE: ${{ github.workspace }}
  # ci-latest runs this file with the newest upstream: scripts/ci-download.sh then warns on a changed hash instead of failing.
  CI_LATEST: ${{ inputs.latest }}

jobs:
  # Docs-only PRs skip the real-binary jobs. lint, test and the Secret scan always run.
  # macOS real-* legs run only off pull requests: five at once per PR run left some without a runner (#56).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "origin/$BASE...HEAD" | grep -qvE '^(docs/|assets/)|^[^/]*\.md$'; then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck $(git ls-files '*.sh')
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: README fits the 1-minute rules
        run: node scripts/check-readme.mjs
      - name: No download is piped into a shell
        run: node scripts/lint-workflows.mjs
      - name: Pins match npm and the git tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pins.mjs
      - name: Third-party actions are pinned to SHAs
        run: |
          if grep -rhE 'uses:[ ]+[^.][^@]+@' .github | grep -vE '@[0-9a-f]{40} # v'; then
            echo '::error::pin each uses: to a full commit SHA with a # vX.Y.Z comment'
            exit 1
          fi
      - name: Checkouts do not persist the token
        run: |
          # A checkout step needs persist-credentials: false in its with: block.
          if awk 'function flush() { if (open) print pf ":" pl; open = 0 } FNR == 1 { flush() } /actions\/checkout@/ { flush(); open = 1; pf = FILENAME; pl = FNR; next } open && /persist-credentials: false/ { open = 0 } END { flush() }' .github/workflows/*.yml | grep .; then
            echo '::error::add persist-credentials: false to each actions/checkout'
            exit 1
          fi

  test:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    env:
      LEAN_AGENTS_SKILL_SOURCE: '' # engine tests assert the pinned tag form
      LEAN_AGENTS_REPO: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}
      LEAN_AGENTS_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Context Mode is skipped on Node older than 24.15
        if: ${{ matrix.node < 24 }}
        shell: bash
        run: |
          # No nvm for this check, whatever the runner image ships: an empty NVM_HOME and an NVM_DIR that does not exist.
          NVM_HOME= NVM_DIR="$RUNNER_TEMP/no-nvm" node scripts/lean.mjs --home "$RUNNER_TEMP/skip-check" --no-exec --dry-run --yes --agents claude --tools context-mode | tee "$RUNNER_TEMP/skip.txt"
          grep -F 'context-mode needs Node >=24.15.0, found ' "$RUNNER_TEMP/skip.txt"
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $issues = git ls-files '*.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error }
          $issues | Format-List
          if ($issues) { exit 1 }
      - name: install.ps1 on PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-install.ps1
      - name: install.ps1 on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-install.ps1
      - name: Without a TTY or --yes, the engine stops instead of hanging (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'notty'
          New-Item -ItemType Directory -Force "$base-home" | Out-Null
          Set-Content "$base.in" ''
          $p = Start-Process node -ArgumentList 'scripts/lean.mjs', '--home', "$base-home", '--no-exec', '--agents', 'claude', '--no-tools' -NoNewWindow -PassThru -RedirectStandardInput "$base.in" -RedirectStandardOutput "$base.out" -RedirectStandardError "$base.err"
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'the installer hung waiting for input' }
          Get-Content "$base.out", "$base.err"
          if ((Get-Content "$base.err" -Raw) -notmatch 'no terminal to ask on') { throw 'expected the no-terminal error' }
      - name: Git Bash without a TTY stops instead of hanging; dry run with --yes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          h="$(mktemp -d)"
          code=0
          timeout 60 node scripts/lean.mjs --home "$h" --no-exec --agents claude --no-tools </dev/null > "$RUNNER_TEMP/gitbash.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/gitbash.txt"
          test "$code" = 1
          grep -q 'no terminal to ask on' "$RUNNER_TEMP/gitbash.txt"
          node scripts/lean.mjs --home "$h" --dry-run --yes --no-exec --agents claude,opencode-v2 --all-tools --network off --profile vertex-gemini
          test -z "$(ls -A "$h")"
      - name: Interactive menus in a pseudo-terminal
        if: runner.os != 'Windows'
        run: python3 tests/real-interactive.py
      - name: Installer dry run in a temporary HOME changes nothing
        if: runner.os != 'Windows'
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh --dry-run --yes --no-exec --agents claude,opencode-v2 --all-tools --privacy strict --profile vertex-gemini
          test -z "$(ls -A "$HOME")"
      - name: With a terminal and stdin from /dev/null, the installer asks, then exits
        if: runner.os == 'Linux'
        run: |
          export HOME="$(mktemp -d)"
          { sleep 3; echo n; } | timeout 30 script -qec 'node scripts/lean.mjs --home "$HOME" --no-exec --agents claude --tools caveman --privacy standard --lang en --bun </dev/null; echo "exit=$?"' /dev/null > "$HOME/tty.txt"
          cat "$HOME/tty.txt"
          grep -q Cancelled "$HOME/tty.txt"
          grep -q 'exit=0' "$HOME/tty.txt"
      - name: Skills install from the checkout
        if: runner.os == 'Linux'
        run: |
          export HOME="$(mktemp -d)"
          npx -y "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.skillsCli()))")" add "$PWD" --skill setup-doctor token-audit update-models -a github-copilot -g -y
          for s in setup-doctor token-audit update-models; do test -f "$HOME/.agents/skills/$s/SKILL.md"; done
      - name: Every profile model exists upstream
        if: runner.os == 'Linux'
        run: node scripts/models-refresh.mjs --check
      - name: Real install, doctor and uninstall in a temporary HOME
        if: runner.os != 'Windows'
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh --yes --no-exec --agents claude,opencode-v2 --all-tools --profile anthropic-api
          node scripts/lean.mjs --doctor --no-exec
          node scripts/lean.mjs --uninstall --yes --no-exec
          test -z "$(find "$HOME" -type f -not -path "$HOME/.config/lean-agents/*")"

  release-build:
    # The steps of release.yml up to the publish, plus a look inside the archives.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build, then check notes and archives on disk
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release.mjs "$version" </dev/null
          grep -q '^- ' dist/notes.md
          tar -tzf "dist/lean-agents-$version.tar.gz" > dist/tar.txt
          grep -q "^lean-agents-$version/install.sh$" dist/tar.txt
          unzip -l "dist/lean-agents-$version.zip" > dist/zip.txt
          grep -q "lean-agents-$version/install.ps1$" dist/zip.txt

  real-opencode:
    # Real OpenCode 2 binary, throwaway HOME: proves the keys we write are accepted.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install OpenCode 2
        run: |
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Install lean-agents and check what OpenCode resolved
        run: bash tests/real-opencode.sh

  real-migrate:
    # --migrate with the real OpenCode 2 and Claude Code binaries, throwaway HOME, no login:
    # `claude mcp add` runs here (no --no-exec) and `claude mcp get` reads the result back.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install Claude Code and OpenCode 2
        run: |
          npm install -g "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('claude-code')))")"
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: bash tests/real-migrate.sh

  real-agent-install:
    # The install-with-an-agent flow in a throwaway HOME, no login: --json output, gh by default and --no-gh
    # (-NoGh through install.ps1 on Windows), and the redacted feedback draft with a stub gh that records its arguments.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - run: node tests/real-agent-install.mjs

  real-proxy:
    # Real install through a squid proxy with direct traffic blocked, network preset all off.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install OpenCode 2
        run: |
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Use the runner's Linuxbrew
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install Antigravity CLI
        run: |
          bash scripts/ci-download.sh antigravity-installer "$RUNNER_TEMP/agy-install"
          bash "$RUNNER_TEMP/agy-install"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install through the proxy only
        # tests/real-proxy.sh calls `gh api /zen` twice (gh behind the proxy, gh with a corporate CA); gh needs a token for that.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/real-proxy.sh

  real-opencode-xdg:
    # Its own job: OpenCode's background service holds a fixed port and keeps the first HOME.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install OpenCode 2
        run: |
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Non-default XDG_CONFIG_HOME reaches the real OpenCode
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/custom-config"
          bash install.sh --yes --no-exec --agents opencode-v2 --privacy strict --profile anthropic-api
          test -d "$XDG_CONFIG_HOME/opencode"
          test ! -e "$HOME/.config/opencode"
          opencode debug config > "$HOME/resolved.txt"
          grep -q lean-agents "$HOME/resolved.txt"

  real-opencode-v1:
    # Real OpenCode 1.x binary, throwaway HOME: proves the 1.x keys are accepted.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install OpenCode 1.19
        run: |
          npm install -g "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('opencode-v1')))")"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Install lean-agents and check what OpenCode resolved
        run: bash tests/real-opencode-v1.sh

  real-parallel:
    # Real git worktrees in a throwaway repo and HOME; real Claude Code and OpenCode only get their flags checked.
    # The Orca path stays VERIFY until a job installs Orca.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install Claude Code and OpenCode 2
        run: |
          npm install -g "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('claude-code')))")"
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: bash tests/real-parallel.sh

  real-claude:
    # Real Claude Code, throwaway HOME, no login: MCP servers go through the claude CLI.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install Claude Code
        run: |
          npm install -g "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('claude-code')))")"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Use the runner's Linuxbrew
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install every tool, check them, uninstall
        run: |
          export HOME="$(mktemp -d)"
          claude --version
          mkdir -p "$HOME/.gemini/antigravity-cli"
          bash install.sh --yes --agents claude --all-tools --privacy standard --lang en --ponytail-mode lite > "$HOME/install.txt"
          cat "$HOME/install.txt"
          if grep -qE '^ *! ' "$HOME/install.txt"; then exit 1; fi
          claude mcp list > "$HOME/mcp.txt"
          cat "$HOME/mcp.txt"
          grep -q serena "$HOME/mcp.txt"
          grep -q playwright "$HOME/mcp.txt"
          if ! grep -q 'context-mode needs Node >=24.15.0' "$HOME/install.txt"; then grep -q 'plugin:context-mode' "$HOME/mcp.txt"; fi
          grep -q 'rtk hook' "$HOME/.claude/settings.json"
          test -f "$HOME/.claude/skills/caveman/SKILL.md"
          grep -q '^disable-model-invocation: false$' "$HOME"/.claude/plugins/cache/i-have-adhd/i-have-adhd/*/skills/i-have-adhd/SKILL.md
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.claude/settings.json", "utf8"))'
          node scripts/lean.mjs --uninstall --yes > "$HOME/uninstall.txt"
          cat "$HOME/uninstall.txt"
          if grep -qE '^ *! ' "$HOME/uninstall.txt"; then exit 1; fi
          claude mcp list > "$HOME/mcp-after.txt"
          cat "$HOME/mcp-after.txt"
          if grep -qE 'serena|playwright|context-mode' "$HOME/mcp-after.txt"; then exit 1; fi
          if grep -q 'rtk hook' "$HOME/.claude/settings.json"; then exit 1; fi
          test ! -e "$HOME/.claude/skills/caveman"

  real-tools:
    # Real tool installs through the engine, throwaway HOME, real OpenCode 2 for the doctor.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.latest }}
        uses: ./.github/actions/latest-pins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FOR_CONTEXT_MODE }}
      - run: npm ci
      - name: Install OpenCode 2
        run: |
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Use the runner's Linuxbrew
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install every tool, then run the doctor
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME/.gemini/antigravity-cli"
          bash install.sh --yes --agents opencode-v2 --tools serena,playwright,ponytail,caveman,i-have-adhd,dcp,codeburn,gsd,autoskills \
            --privacy standard --lang en --profile anthropic-api --ponytail-mode lite
          node scripts/lean.mjs --doctor | tee "$HOME/doctor.txt"
          # Pins recorded at install match core/pins.json, and the skill is the pinned tag.
          grep -q 'pinned versions' "$HOME/doctor.txt"
          if grep -q ' pin ' "$HOME/doctor.txt"; then exit 1; fi
          test -f "$HOME/.agents/skills/caveman/SKILL.md"
          tag="$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.PINS.caveman.version))")"
          git clone --depth 1 --branch "$tag" https://github.com/JuliusBrussee/caveman "$HOME/caveman-src"
          test "$(git -C "$HOME/caveman-src" rev-parse HEAD)" = "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.PINS.caveman.sha))")"
          cmp "$HOME/caveman-src/skills/caveman/SKILL.md" "$HOME/.agents/skills/caveman/SKILL.md"
          grep -q '"gsd-debugger": "anthropic/claude-opus-5-5"' "$HOME/.gsd/defaults.json"
          uvx -p 3.13 --from "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.gitSpec('serena')))")" serena --help
          # The flag the playwright-extension entry passes exists in the real package.
          npx -y "$(node -e "import('./scripts/lib/pins.mjs').then((m) => console.log(m.npmSpec('playwright-mcp')))")" --help > "$HOME/pw-help.txt"
          grep -q -- '--extension' "$HOME/pw-help.txt"
          node scripts/lean.mjs --uninstall --yes > "$HOME/uninstall.txt"
          cat "$HOME/uninstall.txt"
