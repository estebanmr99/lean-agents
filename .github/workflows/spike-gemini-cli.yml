name: Gemini CLI Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install and test Gemini CLI in throwaway HOME
        env:
          # keep npm's cache out of the real HOME so the leak check below stays meaningful
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          # Save initial state of HOME and global node_modules, before the install
          find "$HOME" -maxdepth 2 | sort > "$RUNNER_TEMP/home_before.txt"
          ls "$(npm prefix -g)/lib/node_modules" | sort > "$RUNNER_TEMP/node_modules_before.txt"

          # 0.67.0, published 2026-11-04 (20 days old on 2026-11-24)
          npm install -g @google/gemini-cli@0.67.0 --ignore-scripts

          TMP_HOME=$(mktemp -d)
          
          # Version check
          HOME="$TMP_HOME" gemini --version
          
          # Write minimal config with MCP stub
          mkdir -p "$TMP_HOME/.gemini"
          cat > "$TMP_HOME/.gemini/settings.json" <<EOF
          {
            "mcpServers": {
              "stub": {
                "command": "node",
                "args": ["-e", "console.log(JSON.stringify({mcpVersion: '1.0.0', capabilities: {}, serverInfo: {name: 'stub', version: '1.0.0'}}))"]
              }
            },
            "telemetry": {
              "enabled": false
            },
            "general": {
              "enableAutoUpdate": false
            },
            "privacy": {
              "usageStatisticsEnabled": false
            }
          }
          EOF
          
          # Run the CLI's MCP list command
          HOME="$TMP_HOME" gemini mcp list | tee "$RUNNER_TEMP/mcp_list.txt"
          grep -q "stub" "$RUNNER_TEMP/mcp_list.txt"
          
          # Cleanup
          npm uninstall -g @google/gemini-cli
          rm -rf "$TMP_HOME"
          
          # Verify nothing left behind
          find "$HOME" -maxdepth 2 | sort > "$RUNNER_TEMP/home_after.txt"
          ls "$(npm prefix -g)/lib/node_modules" | sort > "$RUNNER_TEMP/node_modules_after.txt"
          
          diff "$RUNNER_TEMP/home_before.txt" "$RUNNER_TEMP/home_after.txt"
          diff "$RUNNER_TEMP/node_modules_before.txt" "$RUNNER_TEMP/node_modules_after.txt"
          
          echo "Success: Nothing left behind."
