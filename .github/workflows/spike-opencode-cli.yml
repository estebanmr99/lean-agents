name: Spike OpenCode CLI

# #428 items 1-3: help surface, exit codes and event types of the real OpenCode 2 binary for headless workers.
# No login, no secrets, no paid model (local mock LLM and a 403 stub). Runs on PRs that change the spike.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/spike-opencode-cli.sh
      - .github/workflows/spike-opencode-cli.yml
      - tests/fixtures/mock-llm.mjs
      - scripts/ci-install-opencode-v2.sh

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install OpenCode 2 (pinned)
        run: |
          bash scripts/ci-install-opencode-v2.sh
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Spike
        run: bash tests/spike-opencode-cli.sh
