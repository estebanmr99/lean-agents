name: models-refresh

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Open an issue when models changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/models-refresh.mjs > report.md
          cat report.md
          title="Model profiles need review"
          if [ "$(grep -c '^None\.$' report.md)" = 2 ]; then exit 0; fi
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body-file report.md
