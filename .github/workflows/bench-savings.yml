name: Savings Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use (e.g. openrouter/deepseek/deepseek-v4.1-flash-1017)'
        default: 'openrouter/deepseek/deepseek-v4.1-flash-1017'
        required: true
        type: string
      repeats:
        description: 'Number of repeats per task'
        default: '3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bench:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          
      - name: Install OpenCode
        run: npm install -g @opencode/cli@2.2.5
        
      - name: Run Benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          node tests/bench-savings.mjs \
            --home "${RUNNER_TEMP}/bench-home" \
            --run \
            --model "$MODEL" \
            --repeats "$REPEATS" \
            --max-runs 30 \
            --max-usd 4.5 \
            --out "${RUNNER_TEMP}/bench-out"
            
      - name: Upload Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-savings-results
          retention-days: 3
          path: |
            ${{ runner.temp }}/bench-out/
            raw/
