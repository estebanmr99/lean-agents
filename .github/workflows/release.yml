name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/check-readme.mjs
      - run: bash scripts/check-private.sh
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
      - run: node scripts/release.mjs "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip --notes-file dist/notes.md --verify-tag
