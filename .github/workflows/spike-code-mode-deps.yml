name: Spike Code Mode Deps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: Check Dependencies and Sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd spikes/code-mode-deps
          npm ci --ignore-scripts

      - name: Audit Signatures
        continue-on-error: true
        run: |
          cd spikes/code-mode-deps
          npm audit signatures >> $GITHUB_STEP_SUMMARY

      - name: Audit Security
        continue-on-error: true
        run: |
          cd spikes/code-mode-deps
          npm audit --omit=dev --audit-level=high >> $GITHUB_STEP_SUMMARY

      - name: Run Probe
        run: |
          cd spikes/code-mode-deps
          node probe.mjs
          cat SUMMARY.md >> $GITHUB_STEP_SUMMARY

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result
          path: spikes/code-mode-deps/result.json
          retention-days: 7
